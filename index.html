<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Calculator — Sucii</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>💰 Cash Flow Calculator</h2>
      <p>Hitung arus kas, estimasi pengeluaran, dan saldo bersih operasional.</p>
    </div>

    <form id="cashflow-form">
      <div class="form-group">
        <label for="income">Total Pemasukan (Rp)</label>
        <input type="number" id="income" placeholder="Contoh: 15000000" required>
      </div>

      <div class="form-group">
        <label for="fixed-expense">Pengeluaran Tetap (Rp)</label>
        <input type="number" id="fixed-expense" placeholder="Contoh: 5000000" required>
      </div>

      <div class="form-group">
        <label for="variable-expense">Pengeluaran Variabel (Rp)</label>
        <input type="number" id="variable-expense" placeholder="Contoh: 2000000" required>
      </div>

      <button type="submit" class="btn">Hitung Cash Flow</button>
    </form>

    <div id="result-box" class="result-box hidden">
      <h3>Hasil Perhitungan</h3>
      <div class="result-item">
        <span>Sisa Arus Kas Bersih:</span>
        <strong id="net-cashflow">Rp 0</strong>
      </div>
      <div class="result-item">
        <span>Status Arus Kas:</span>
        <strong id="cashflow-status">-</strong>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('cashflow-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const income = parseFloat(document.getElementById('income').value) || 0;
      const fixed = parseFloat(document.getElementById('fixed-expense').value) || 0;
      const variable = parseFloat(document.getElementById('variable-expense').value) || 0;

      const totalExpense = fixed + variable;
      const netCashflow = income - totalExpense;

      const netEl = document.getElementById('net-cashflow');
      const statusEl = document.getElementById('cashflow-status');

      netEl.textContent = 'Rp ' + netCashflow.toLocaleString('id-ID');
      
      if (netCashflow > 0) {
        statusEl.textContent = 'Surplus (Positif) 🟢';
        statusEl.style.color = '#34d399';
      } else if (netCashflow === 0) {
        statusEl.textContent = 'Impas (Neutral) 🟡';
        statusEl.style.color = '#fbbf24';
      } else {
        statusEl.textContent = 'Defisit (Negatif) 🔴';
        statusEl.style.color = '#f87171';
      }

      document.getElementById('result-box').classList.remove('hidden');
    });
  </script>
</body>
</html>
